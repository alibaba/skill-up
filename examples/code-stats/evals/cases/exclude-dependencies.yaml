id: exclude-dependencies
title: 统计项目代码时排除依赖目录
description: 验证代码统计不会把 node_modules 中的第三方文件算作项目源码

input:
  prompt: |
    请先调用 skill 工具加载 code-stats，然后严格按照 Skill 自己的目录扫描规则统计 ./project 的文件与扩展名分布，不要自行添加忽略规则。按 Skill 规定的完整格式报告。

context:
  files:
    project/README.md: |
      # Demo Project
    project/main.go: |
      package main

      func main() {}
    project/util.go: |
      package main

      func helper() {}
    project/node_modules/demo-lib/index.js: |
      export function externalDependency() {
        return 'third-party code';
      }

constraints:
  timeout_seconds: 900
  max_turns: 5

judge:
  type: rule_based
  success:
    - output_matches:
        all:
          - '(?m)^- Total Files: 3$'
          - '(?m)^\| \.go \| 2 \| [0-9]+ \|$'
          - '(?m)^\| \.md \| 1 \| [0-9]+ \|$'
        not:
          - '(?m)^\| \.js \|'

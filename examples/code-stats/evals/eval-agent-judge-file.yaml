schema_version: v1alpha1
environment:
  type: none
skills:
  - source: local_path
    path: .
engine:
  name: qodercli
  model:
    name: fast
cases:
  files:
    - evals/cases/agent-judge-file.yaml
  defaults:
    timeout_seconds: 900
judge:
  type: agent_judge
  engine:
    name: qodercli
    model:
      provider: qoder
      name: fast
  output:
    mode: file
  timeout_seconds: 300
  criteria:
    - The report identifies the total file count and line count using workspace evidence.
    - The report groups file statistics by extension and identifies the largest files.
report:
  formats: [json]

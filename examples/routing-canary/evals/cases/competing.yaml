id: competing
title: Two installed Skills, only the translation Skill matches
tag: routing
input:
  prompt: "Translate this French line into English: 'La nuit tombe sur la ville.' Use the Skill that covers French poetry translation."
constraints:
  timeout_seconds: 180
  max_turns: 3
expect:
  files_exist: [".translation-done"]
  files_not_exist: [".canary-relevant"]
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["TRANSLATION-OK"]

version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Delay newly published versions long enough for early regressions or
    # compromised releases to be detected. Security updates are unaffected.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/otel*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  # GitHub Actions versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

  # Documentation toolchain dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      documentation:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  # Experimental DeepSeek Harness plugin dependencies.
  - package-ecosystem: "npm"
    directory: "/plugins/dsh-skill-up"
    # dsh-agent 0.1.5-rc.3 requires cordis 4.0.2 exactly.
    ignore:
      - dependency-name: "@deepseek-ai/cordis"
        versions: ["4.0.4"]
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      deepseek-harness:
        patterns:
          - "@deepseek-ai/*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  # Runner image base images and Dockerfile dependencies.
  - package-ecosystem: "docker"
    directory: "/action"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

name: Extended CI

# Deterministic, credential-free checks that are suitable for merge-queue
# gating. Live-model tests live in model-e2e.yml and run only on demand.
on:
  merge_group:
  workflow_dispatch:
    inputs:
      windows_guest:
        description: Run the real OpenSandbox Windows guest lifecycle test
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e-windows:
    name: E2E (none runtime, Windows)
    # No trusted Windows self-hosted runner is provisioned. Use a clean,
    # explicitly versioned GitHub-hosted Windows image.
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: true

      - name: Run e2e tests (none runtime, quick mode)
        shell: bash
        run: go test -tags e2e -timeout 1200s -count=1 -v ./e2e
        env:
          SKILL_UP_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts

      - name: Upload e2e workspace artifacts
        if: always() && hashFiles('e2e-artifacts/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-windows-workspaces
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14


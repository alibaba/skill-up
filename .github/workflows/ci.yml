name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required checks must also run for commits synthesized by Merge Queue.
  merge_group:

# Keep live engine, sandbox, Windows and release checks outside the default gate,
# and cancel only superseded pull-request work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  classify:
    name: Classify changes
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect documentation-only pull request
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_full=true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            run_full=false
            while IFS= read -r -d '' path; do
              if [[ "$path" == docs/* || "$path" == ".github/workflows/docs.yml" ]]; then
                continue
              fi
              if [[ "$path" != */* && "$path" == *.md ]]; then
                continue
              fi
              run_full=true
              break
            done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    # Workflows from external contributors require maintainer approval before
    # they can execute on the trusted self-hosted runner fleet.
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # Reuse persistent runner caches without remote archive transfers.
          cache: false

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -timeout 120s -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js for plugins
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Test Codex skill-up plugin
        run: make test-plugin

      - name: Test GitHub Action adapter
        run: make test-action

      - name: Test DSH plugin
        working-directory: plugins/dsh-skill-up
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Report coverage
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          if [ -z "$pct" ]; then
            echo "could not parse total coverage" >&2
            exit 1
          fi
          echo "::notice::Total coverage: ${pct}%"

  # Keep the displayed name stable because repository rulesets require it.
  e2e-smoke:
    name: E2E Smoke
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # Reuse persistent runner caches without remote archive transfers.
          cache: false

      - name: Run deterministic e2e suite
        run: go test -tags e2e -timeout 1200s -count=1 -v ./e2e
        env:
          SKILL_UP_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts

      - name: Upload e2e workspace artifacts
        if: always() && hashFiles('e2e-artifacts/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-smoke-workspaces
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  codex-compat:
    name: Codex compatibility (${{ matrix.version }}, ${{ matrix.wire_api }})
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "0.169.0"
            wire_api: responses
          - version: "0.80.0"
            wire_api: chat
          - version: "0.80.0"
            wire_api: responses
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pinned Codex
        env:
          CODEX_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          prefix=$(mktemp -d "$RUNNER_TEMP/codex-compat.XXXXXX")
          npm install --prefix "$prefix" --no-save --package-lock=false --ignore-scripts \
            --registry=https://registry.npmjs.org "@openai/codex@$CODEX_VERSION"
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prove the regression test fails before the fix
        if: matrix.version == '0.80.0'
        env:
          SKILL_UP_CODEX_COMPAT_E2E: "1"
          SKILL_UP_CODEX_EXPECTED_VERSION: ${{ matrix.version }}
          SKILL_UP_CODEX_WIRE_API: ${{ matrix.wire_api }}
        run: |
          set -euo pipefail
          original=$(mktemp "$RUNNER_TEMP/codex-source.XXXXXX")
          cp internal/agent/codex.go "$original"
          trap 'cp "$original" internal/agent/codex.go; rm -f "$original"' EXIT
          git apply --ignore-whitespace <<'PATCH'
          diff --git a/internal/agent/codex.go b/internal/agent/codex.go
          --- a/internal/agent/codex.go
          +++ b/internal/agent/codex.go
          @@ -1010,9 +1010,9 @@
           func buildCodexResumeCmdWithLastMessage(sessionID, instruction, model string, provider codexProviderConfig, lastMessagePath, mcpFlags string) string {
               // In 0.80.0 this is an exec-only option, not a global resume option.
          -    cmd := "codex exec"
          +    cmd := "codex exec resume"
               if lastMessagePath != "" {
                   cmd += " --output-last-message " + shellQuote(lastMessagePath)
               }
          -    cmd += " resume --json --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox" + mcpFlags
          +    cmd += " --json --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox" + mcpFlags
               cmd += codexProviderFlags(provider)
               if model != "" {
          PATCH
          log=$(mktemp "$RUNNER_TEMP/codex-regression.XXXXXX")
          if go test -race -tags e2e -timeout 300s -count=1 -v \
            -run '^TestCodexCLICompatibility$' ./e2e > "$log" 2>&1; then
            cat "$log"
            echo "::error::Pre-fix implementation unexpectedly passed."
            exit 1
          fi
          cat "$log"
          grep -F "turn 2:" "$log"
          grep -F "unexpected argument '--output-last-message'" "$log"

      - name: Verify real CLI resume and request history after the fix
        run: go test -race -tags e2e -timeout 300s -count=1 -v -run '^TestCodexCLICompatibility$' ./e2e
        env:
          SKILL_UP_CODEX_COMPAT_E2E: "1"
          SKILL_UP_CODEX_EXPECTED_VERSION: ${{ matrix.version }}
          SKILL_UP_CODEX_WIRE_API: ${{ matrix.wire_api }}

  lint:
    name: Lint
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # Self-hosted runners retain Go caches; restoring/uploading the shared
          # multi-GB archive can collide with existing modules and time out.
          cache: false

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

      - name: Install revive
        run: go install github.com/mgechev/revive@v1.10.0

      - name: Run revive
        run: revive -config revive.toml ./...

  gate:
    name: CI Gate
    if: ${{ !cancelled() }}
    needs: [classify, build, e2e-smoke, codex-compat, lint]
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 5
    env:
      RUN_FULL: ${{ needs.classify.outputs.run_full }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      E2E_RESULT: ${{ needs.e2e-smoke.result }}
      CODEX_RESULT: ${{ needs.codex-compat.result }}
      LINT_RESULT: ${{ needs.lint.result }}
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification failed: $CLASSIFY_RESULT" >&2
            exit 1
          fi

          if [ "$RUN_FULL" = "false" ]; then
            echo "Documentation-only pull request; full CI is deferred to main."
            exit 0
          fi

          failed=false
          for result in "$BUILD_RESULT" "$E2E_RESULT" "$CODEX_RESULT" "$LINT_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=true
            fi
          done
          if [ "$failed" = "true" ]; then
            echo "Required CI jobs did not all succeed:" >&2
            echo "  Build & Test: $BUILD_RESULT" >&2
            echo "  E2E Smoke: $E2E_RESULT" >&2
            echo "  Codex compatibility: $CODEX_RESULT" >&2
            echo "  Lint: $LINT_RESULT" >&2
            exit 1
          fi

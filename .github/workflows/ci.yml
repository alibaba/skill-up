name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required checks must also run for commits synthesized by Merge Queue.
  merge_group:

# Keep the default gate small and cancel only superseded pull-request work.
# Expensive engine, sandbox, Windows and release checks live in extended-ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  classify:
    name: Classify changes
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_full: ${{ steps.changes.outputs.run_full }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect documentation-only pull request
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_full=true

          if [ "$EVENT_NAME" = "pull_request" ]; then
            run_full=false
            while IFS= read -r -d '' path; do
              if [[ "$path" == docs/* || "$path" == ".github/workflows/docs.yml" ]]; then
                continue
              fi
              if [[ "$path" != */* && "$path" == *.md ]]; then
                continue
              fi
              run_full=true
              break
            done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Test
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    # Workflows from external contributors require maintainer approval before
    # they can execute on the trusted self-hosted runner fleet.
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -timeout 120s -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test GitHub Action adapter
        run: make test-action

      - name: Report coverage
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          if [ -z "$pct" ]; then
            echo "could not parse total coverage" >&2
            exit 1
          fi
          echo "::notice::Total coverage: ${pct}%"

  e2e-smoke:
    name: E2E Smoke
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Run quick e2e smoke
        run: go test -tags e2e -timeout 1200s -count=1 -v -run 'Test(Pipeline|CLI|Contract|NoneRuntime)_' ./e2e
        env:
          SKILL_UP_E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts

      - name: Upload e2e workspace artifacts
        if: always() && hashFiles('e2e-artifacts/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-smoke-workspaces
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Lint
    needs: classify
    if: needs.classify.outputs.run_full == 'true'
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4

      - name: Install revive
        run: go install github.com/mgechev/revive@v1.10.0

      - name: Run revive
        run: revive -config revive.toml ./...

  gate:
    name: CI Gate
    if: ${{ !cancelled() }}
    needs: [classify, build, e2e-smoke, lint]
    runs-on: [self-hosted, linux, x64, trusted]
    timeout-minutes: 5
    env:
      RUN_FULL: ${{ needs.classify.outputs.run_full }}
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      E2E_RESULT: ${{ needs.e2e-smoke.result }}
      LINT_RESULT: ${{ needs.lint.result }}
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Change classification failed: $CLASSIFY_RESULT" >&2
            exit 1
          fi

          if [ "$RUN_FULL" = "false" ]; then
            echo "Documentation-only pull request; full CI is deferred to main."
            exit 0
          fi

          failed=false
          for result in "$BUILD_RESULT" "$E2E_RESULT" "$LINT_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=true
            fi
          done
          if [ "$failed" = "true" ]; then
            echo "Required CI jobs did not all succeed:" >&2
            echo "  Build & Test: $BUILD_RESULT" >&2
            echo "  E2E Smoke: $E2E_RESULT" >&2
            echo "  Lint: $LINT_RESULT" >&2
            exit 1
          fi

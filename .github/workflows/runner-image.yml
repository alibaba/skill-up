name: Runner Image

# Builds the runner image used by the Agent Skill Eval action (action.yml):
# bakes skill-up + claude + codex + qodercli from public registries and pushes
# to ghcr.io/<this-org>/skill-up-runner via the built-in GITHUB_TOKEN (no PAT).
#
# Triggers:
#   - workflow_call: invoked by skill-upper-self-eval.yml so the dogfood eval always
#     runs against an image built from the same commit (no pull/push race).
#   - push to main touching the action runtime -> republish.
#   - workflow_dispatch -> manual (re)publish at an explicit tag.
#
# NOTE: pushing under the org namespace requires the org to allow Actions to
# create packages (verified working for this repo).

on:
  workflow_call:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: false
        type: string
        default: 'v0.1.0'
      publish_latest:
        description: 'Also publish the latest tag'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'action/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'
      publish_latest:
        description: 'Also publish the latest tag'
        required: true
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/skill-up-runner

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, docker, trusted]
    timeout-minutes: 30
    environment: release-image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve tags & push policy
        id: meta
        env:
          # Keep the reusable workflow build-only if a future PR caller is added.
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest }}
          REQUESTED_TAG: ${{ inputs.tag || 'v0.1.0' }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag"
            exit 1
          fi
          {
            echo "tags<<__TAGS__"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              # PR dogfood builds publish an isolated, PR-scoped tag — NEVER the
              # mutable release tags (v0.1.0 / latest), which released action
              # users consume via alibaba/skill-up@v0.1.0. An unmerged PR must
              # not be able to replace the production runner image.
              echo "${IMAGE}:pr-${{ github.event.pull_request.number }}"
            else
              # push to main / manual dispatch = release; reusable callers can
              # opt into latest explicitly, but self-eval uses an isolated tag.
              echo "${IMAGE}:${REQUESTED_TAG}"
              if [ "$PUBLISH_LATEST" = "true" ]; then
                echo "${IMAGE}:latest"
              fi
            fi
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"
          echo "push=${SAME_REPO}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./action
          file: ./action/Dockerfile
          # amd64 only: GitHub cloud runners are x86_64, and qodercli's
          # bun-compiled binary crashes under qemu arm64 emulation (its
          # --version self-check exits 1). Revisit with native arm64 runners
          # if self-hosted arm consumers show up.
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          # Avoid the GitHub Actions Cache backend here: transient GHA cache
          # outages fail the whole image build after the registry push starts.

      - name: Record image digest
        if: steps.meta.outputs.push == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$IMAGE_DIGEST" ]; then
            echo "::error::Build completed without an image digest"
            exit 1
          fi
          echo "### Published runner image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

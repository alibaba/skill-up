schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  type: qoder-cli
  model:
    provider: qoder
    name: auto

cases:
  files:
    - evals/cases/must-contain-pass.yaml
    - evals/cases/must-contain-fail.yaml
    - evals/cases/rule-based-pass.yaml
    - evals/cases/script-judge.yaml
  defaults:
    timeout_seconds: 30
    max_turns: 1
  parallelism: 1

report:
  formats: [json]

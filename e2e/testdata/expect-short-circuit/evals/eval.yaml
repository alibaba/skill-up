schema_version: v1alpha1

environment:
  type: none
  workspace_mount: /workspace
  env:
    TZ: UTC

mcp:
  servers: []

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    provider: dashscope
    name: qwen3.6-plus

cases:
  files:
    - evals/cases/basic-arithmetic.yaml
    - evals/cases/exit-code-mismatch.yaml
  defaults:
    timeout_seconds: 60
    max_turns: 3
  parallelism: 1

report:
  formats: [json]
  artifacts:
    - transcript

schema_version: v1alpha1

environment:
  type: none

engine:
  name: e2e-custom-stateful-local-agent
  custom:
    transport: local
    conversation_mode: stateful
    response_format: session_result
    local:
      command: ${CUSTOM_STATEFUL_AGENT_BIN}
      args: ["${input_file}"]

cases:
  files:
    - evals/cases/stateful.yaml
  defaults:
    timeout_seconds: 60
  parallelism: 1

report:
  formats: [json]

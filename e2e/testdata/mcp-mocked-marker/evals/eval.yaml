schema_version: v1alpha1

environment:
  type: none

mcp:
  servers:
    - name: marker
      mode: mocked
      config_ref: evals/fixtures/mcp/marker.yaml

skills: []

engine:
  name: claude_code
  model:
    provider: anthropic
    name: qwen3.6-plus

cases:
  files:
    - evals/cases/smoke.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 1
  parallelism: 1

report:
  formats: [json]
  artifacts:
    - transcript

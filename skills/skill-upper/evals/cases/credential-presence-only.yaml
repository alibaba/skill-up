id: credential-presence-only
title: Check authentication presence without exposing values
context:
  repo_fixture: evals/fixtures/skills/sample-no-evals
input:
  prompt: |
    Use skill-upper's credential preparation guidance to create a POSIX shell
    script credential-check.sh that checks only OPENAI_API_KEY presence.
    Output only configured or missing, never the value, including when shell
    tracing is enabled. The probe must not create or modify files.
    Use only printenv, grep, printf, echo, true/false/:, if/then/else/elif/fi,
    and pipelines or &&/||; use literal arguments, with no shell expansions,
    redirections, command substitutions, other commands, or sourced code.
    Use printenv only with OPENAI_API_KEY. Use grep only as grep -q PATTERN,
    grep -q -- PATTERN, or grep -q -e PATTERN, reading pipeline input without
    file operands or pattern files. For grep -q PATTERN, PATTERN must not start with '-'.
    Quote or escape regex characters that would otherwise expand as shell globs.
    Do not run evaluations or read credential files.
    Do not use interpreter environment APIs for authentication checks; use the
    printenv-to-grep presence pipeline above, without reading values into code.
judge:
  type: script
  script_path: evals/fixtures/scripts/assert-credential-presence.sh
  timeout_seconds: 30

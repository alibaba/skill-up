schema_version: v1alpha1

environment:
  type: none
  workspace_mount: /workspace
  # platform and resources are optional OpenSandbox settings; omission keeps
  # the existing Linux profile and SDK resource defaults.
  env: {}

mcp:
  servers: []

skills: []

engine:
  name: claude_code
  model: {}

cases:
  files: []
  defaults:
    timeout_seconds: 300
    max_turns: 10
  parallelism: 1

report:
  formats: [json]
  artifacts: []

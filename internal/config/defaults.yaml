schema_version: v1alpha1

environment:
  type: none
  workspace_mount: /workspace
  env: {}

mcp:
  servers: []

skills: []

engine:
  name: claude_code
  model: {}

# Agent judges may set judge.engine independently; there is no implicit default.
# Omit judge.engine to retain legacy judge.model / runner engine behavior.
# judge.output.mode defaults to final_message; set file for a runtime JSON result template.

# Optional. Set provider, protocol (openai or anthropic), and model to simulate user replies.
user_simulator: {}

cases:
  files: []
  defaults:
    timeout_seconds: 300
    max_turns: 10
    expect: {}
  parallelism: 1

report:
  formats: [json]
  artifacts: []

ignoreGeneratedHeader = false
severity = "warning"
confidence = 0.8
# Non-zero exit codes make CI's `revive` step actually fail on violations.
# With both at 0 (revive's defaults), warnings become GitHub inline
# annotations but the Lint job stays green — issues silently pass review,
# as happened on PR #62 with flag-parameter and context-as-argument hits.
errorCode = 1
warningCode = 1

[rule.context-keys-type]
[rule.time-equal]
[rule.var-declaration]
[rule.time-naming]
[rule.unexported-return]
[rule.errorf]
[rule.blank-imports]
[rule.context-as-argument]
[rule.dot-imports]
[rule.error-return]
[rule.error-strings]
[rule.error-naming]
[rule.exported]
[rule.if-return]
[rule.increment-decrement]
[rule.var-naming]
[rule.package-comments]
  disabled = true
[rule.range]
[rule.receiver-naming]
[rule.indent-error-flow]
[rule.empty-block]
[rule.superfluous-else]
[rule.confusing-naming]
[rule.get-return]
[rule.modifies-parameter]
[rule.confusing-results]
[rule.deep-exit]
[rule.flag-parameter]
[rule.unnecessary-stmt]
[rule.modifies-value-receiver]

[rule.constant-logical-expr]
[rule.redefines-builtin-id]

[rule.imports-blacklist]
[rule.range-val-in-closure]
[rule.range-val-address]
[rule.waitgroup-by-value]
[rule.call-to-gc]
[rule.atomic]
[rule.duplicated-imports]
[rule.import-shadowing]
[rule.bare-return]
[rule.string-of-int]
[rule.string-format]
[rule.early-return]
[rule.unconditional-recursion]
[rule.identical-branches]
[rule.bool-literal-in-expr]
[rule.defer]
[rule.unexported-naming]
[rule.optimize-operands-order]
[rule.datarace]
[rule.comment-spacings]

